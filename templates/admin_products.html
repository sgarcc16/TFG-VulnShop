<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestionar productos - VulnShop</title>
</head>

<body>

    <h1>Gestionar productos</h1>

    <a href="{{ url_for('admin_create_product') }}">
        Crear nuevo producto
    </a>

    <hr>

    {% for product in products %}

        <div>

            <h2>{{ product["name"] }}</h2>

            <p>
                <strong>ID:</strong>
                {{ product["id"] }}
            </p>

            <p>
                <strong>Precio:</strong>
                {{ product["price"] }} €
            </p>

            <p>
                <strong>Stock:</strong>
                {{ product["stock"] }}
            </p>

            <a href="{{ url_for('admin_edit_product', product_id=product['id']) }}">
                Editar
            </a>

            <form
                action="{{ url_for('admin_delete_product', product_id=product['id']) }}"
                method="POST"
            >

                <button type="submit">
                    Eliminar
                </button>

            </form>

        </div>

        <hr>

    {% endfor %}

    <a href="/admin">Volver al panel de administración</a>

</body>

</html>
