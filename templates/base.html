<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            VulnShop
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <div class="navbar">

        <a
            href="{{ url_for('index') }}"
            class="logo"
        >
            VulnShop
        </a>

        <nav>

            <a href="{{ url_for('index') }}">
                Inicio
            </a>

            <a href="{{ url_for('products') }}">
                Productos
            </a>

            {% if session.get("user_id") %}

                <a href="{{ url_for('orders') }}">
                    Mis pedidos
                </a>

                <a href="{{ url_for('profile') }}">
                    Mi perfil
                </a>

                {% if session.get("role") == "admin" %}

                    <a href="{{ url_for('admin') }}">
                        Administración
                    </a>

                {% endif %}

                <a href="{{ url_for('logout') }}">
                    Cerrar sesión
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">
                    Iniciar sesión
                </a>

                <a href="{{ url_for('register') }}">
                    Registrarse
                </a>

            {% endif %}

        </nav>

    </div>

</header>


<main class="container">

    {% block content %}

    {% endblock %}

</main>


<footer>

    VulnShop — Laboratorio de seguridad para TFG

</footer>


</body>

</html>
