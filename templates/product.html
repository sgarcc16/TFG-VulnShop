<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{{ product["name"] }} - VulnShop</title>
</head>

<body>

    <h1>{{ product["name"] }}</h1>

    <p>{{ product["description"] }}</p>

    <p>
        <strong>Precio:</strong>
        {{ product["price"] }} €
    </p>

    <p>
        <strong>Stock disponible:</strong>
        {{ product["stock"] }}
    </p>
    
    {% if session.get("user_id") %}

    <h2>Comprar producto</h2>

        <form action="{{ url_for('buy_product', product_id=product['id']) }}" method="POST">

            <label>Cantidad:</label>

            <input
                type="number"
                name="quantity"
                value="1"
                min="1"
                max="{{ product['stock'] }}"
                required
            >

            <button type="submit">Comprar</button>

        </form>

    {% else %}

        <p>
            <a href="/login">Inicia sesión</a>
            para comprar este producto.
        </p>

    {% endif %}

    <br>

    <a href="/productos">Volver a productos</a>
    <br>
    <a href="/">Volver al inicio</a>

</body>

</html>
