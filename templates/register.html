{% extends "base.html" %}


{% block title %}

Registro - VulnShop

{% endblock %}


{% block content %}


<div class="card">

    <h1>Crear cuenta</h1>

    <form method="POST">


        <label>
            Nombre de usuario
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Correo electrónico
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button
            type="submit"
            class="btn"
        >
            Registrarse
        </button>

    </form>

</div>


{% endblock %}
