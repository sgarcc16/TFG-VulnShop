{% extends "base.html" %}


{% block title %}

Iniciar sesión - VulnShop

{% endblock %}


{% block content %}


<div class="card">

    <h1>Iniciar sesión</h1>

    <form method="POST">

        <label>
            Nombre de usuario
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button
            type="submit"
            class="btn"
        >
            Iniciar sesión
        </button>

    </form>


    <p>
        ¿No tienes cuenta?

        <a href="{{ url_for('register') }}">
            Registrarse
        </a>
    </p>

</div>


{% endblock %}
