{% extends "base.html" %}

{% block title %}
Mi perfil - VulnShop
{% endblock %}

{% block content %}

<h1>Mi perfil</h1>

<div class="card">

    <p>
        <strong>ID:</strong>
        {{ user["id"] }}
    </p>

    <p>
        <strong>Usuario:</strong>
        {{ user["username"] }}
    </p>

    <p>
        <strong>Correo electrónico:</strong>
        {{ user["email"] }}
    </p>

    <p>
        <strong>Rol:</strong>
        {{ user["role"] }}
    </p>

</div>

<a
    href="{{ url_for('orders') }}"
    class="btn"
>
    Ver mis pedidos
</a>

{% endblock %}
