{% extends "base.html" %}

{% block title %}
Nuevo producto - VulnShop
{% endblock %}

{% block content %}

<div class="card form-card">

    <h1>Crear producto</h1>

    <form method="POST">

        <label for="name">
            Nombre
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >


        <label for="description">
            Descripción
        </label>

        <textarea
            id="description"
            name="description"
            required
        ></textarea>


        <label for="price">
            Precio
        </label>

        <input
            type="number"
            id="price"
            name="price"
            min="0"
            step="0.01"
            required
        >


        <label for="stock">
            Stock
        </label>

        <input
            type="number"
            id="stock"
            name="stock"
            min="0"
            required
        >


        <button
            type="submit"
            class="btn"
        >
            Crear producto
        </button>

        <a
            href="/admin/productos"
            class="btn btn-secondary"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
